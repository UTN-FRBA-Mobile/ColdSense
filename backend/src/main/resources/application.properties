spring.application.name=coldwatch-backend

# Puerto 8080 = el que usa BASE_URL en ApiClient.kt (http://10.0.2.2:8080/)
server.port=8080

# Escucha en todas las interfaces para poder probar desde un celular físico en la misma red
server.address=0.0.0.0

# Muestra el motivo del error en las respuestas (útil mientras desarrollás)
server.error.include-message=always

# Clave de la cuenta de servicio de Firebase (no se sube al repo, ver README).
# Sin este archivo el backend funciona igual, pero no manda push notifications
firebase.credenciales=firebase-credenciales.json
